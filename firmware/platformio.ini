[env:esp32s3_n16r8]
; Pinned for reproducible builds with Arduino-ESP32 2.x APIs.
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1-N16R8: 16 MB QIO flash + 8 MB OPI PSRAM.
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

lib_deps =
    lovyan03/LovyanGFX@1.2.36

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

; 固件模式在 include/app_config.h 里切换（改一行宏即可，不用动本文件）：
;   APP_DISPLAY_TEST = 1   点屏自检，只测屏和触摸
;   APP_DISPLAY_TEST = 0   完整仪表盘，屏 + 触摸 + AHT20 / BMP280 / GPS
